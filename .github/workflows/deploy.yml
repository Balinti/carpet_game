name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.1'
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Build web
        run: flutter build web --release --pwa-strategy=none --base-href "/carpet_game/"

      - name: Replace service worker with a cache-clearing one
        # Old builds cached the app on phones; this worker wipes those caches
        # and removes itself so every visit gets the latest version.
        run: |
          cat > build/web/flutter_service_worker.js <<'JS'
          self.addEventListener('install', () => self.skipWaiting());
          self.addEventListener('activate', (e) => {
            e.waitUntil((async () => {
              for (const k of await caches.keys()) await caches.delete(k);
              await self.registration.unregister();
              for (const c of await self.clients.matchAll({ type: 'window' })) c.navigate(c.url);
            })());
          });
          JS

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build/web
          force_orphan: true
